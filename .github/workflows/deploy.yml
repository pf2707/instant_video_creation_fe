name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # change to "master" if that is your default branch
  workflow_dispatch:

# Needed so the workflow can push the built site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/web/package-lock.json

      - run: npm ci

      # Build with base set to "/<repo-name>/" so asset URLs resolve on Pages.
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # .nojekyll stops GitHub's Jekyll from processing the built assets.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # Publish the built app to the gh-pages branch (Deploy from a branch).
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/web/dist
          publish_branch: gh-pages
